name: Deploy to Windows Server (지성 IDC)

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 폴더 전환이 꼬이므로 한 번에 하나만
concurrency:
  group: deploy-jisung-idc
  cancel-in-progress: false

jobs:
  deploy:
    # 지성 IDC 서버(jisung-idc)의 러너에서만 실행
    runs-on: [self-hosted, jisung-idc]

    defaults:
      run:
        working-directory: D:\Project\WBSMaster

    steps:
      - name: Check current user
        run: |
          echo "=== Current User ==="
          whoami
          echo %PM2_HOME%
        shell: cmd

      - name: Configure Git safe directory
        run: git config --global --add safe.directory D:/Project/WBSMaster

      # 새 커밋을 받아 오기만 한다 (서비스 중인 폴더의 파일은 바꾸지 않는다)
      - name: Fetch latest code
        run: |
          git fetch origin main
          if %errorlevel% neq 0 exit /b 1
        shell: cmd

      # 두 폴더(A: D:\Project\WBSMaster, B: D:\Project\WBSMaster-b)를 번갈아 쓰는 배포.
      # 쉬는 폴더에서 npm ci → 운영 DB 마이그레이션 확인 → 빌드 → 3021 포트 사전 점검까지 끝낸 뒤에만 PM2 를 옮긴다.
      # 마이그레이션이 운영 DB 에 없으면 여기서 멈추고 서비스는 그대로다 (해결: SQL 적용 후 prisma migrate resolve --applied).
      # 스크립트는 배포할 커밋에서 꺼내 쓴다 (서비스 중인 폴더의 예전 스크립트를 쓰지 않게). cmd 리다이렉션은 BOM 을 그대로 둔다.
      - name: Blue-green deploy
        run: |
          git show ${{ github.sha }}:scripts/deploy-blue-green.ps1 > "%TEMP%\wbs-deploy-blue-green.ps1"
          if %errorlevel% neq 0 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%TEMP%\wbs-deploy-blue-green.ps1" -Sha ${{ github.sha }}
          if %errorlevel% neq 0 exit /b 1
        shell: cmd
