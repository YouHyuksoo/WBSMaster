name: Deploy to Windows Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: C:\Project\WBSMaster

    steps:
      - name: Check current user
        run: |
          echo "=== Current User ==="
          whoami
          echo "=== PM2 Home ==="
          echo %PM2_HOME%
          echo %USERPROFILE%
        shell: cmd

      - name: Configure Git safe directory
        run: git config --global --add safe.directory C:/Project/WBSMaster

      - name: Stop WBSMaster process only
        run: |
          set PM2_HOME=C:\Users\Administrator\.pm2
          echo "=== Stopping wbs-master only (not killing PM2) ==="
          pm2 stop wbs-master 2>nul || echo "wbs-master not running"
          pm2 delete wbs-master 2>nul || echo "wbs-master not registered"
        shell: cmd
        continue-on-error: true

      - name: Pull latest code
        run: |
          git fetch origin master
          git reset --hard origin/master

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Restart PM2 via scheduled task
        run: |
          echo "=== Scheduling PM2 restart (detached from runner) ==="
          schtasks /delete /tn "WBSMaster_PM2" /f 2>nul
          schtasks /create /tn "WBSMaster_PM2" /tr "C:\Project\WBSMaster\scripts\pm2-restart.cmd" /sc once /st 00:00 /ru HS_ADMIN /rl highest /f
          schtasks /run /tn "WBSMaster_PM2"
          echo "=== Waiting for PM2 to start ==="
          timeout /t 8 /nobreak >nul
          echo "=== Verifying PM2 status ==="
          set PM2_HOME=C:\Users\Administrator\.pm2
          pm2 list || echo "PM2 list check done"
        shell: cmd
