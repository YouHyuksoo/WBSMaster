name: Deploy to Windows Server (지성 IDC)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    # 지성 IDC 서버(jisung-idc)의 러너에서만 실행
    runs-on: [self-hosted, jisung-idc]

    defaults:
      run:
        working-directory: D:\Project\WBSMaster

    steps:
      - name: Check current user
        run: |
          echo "=== Current User ==="
          whoami
          echo "=== PM2 Home ==="
          echo %PM2_HOME%
          echo %USERPROFILE%
        shell: cmd

      - name: Configure Git safe directory
        run: git config --global --add safe.directory D:/Project/WBSMaster

      # ── 1단계: 코드 pull ──────────────────────────────────────────────────
      - name: Pull latest code
        run: |
          git fetch origin master
          git reset --hard origin/master

      # ── 1-1단계: 운영 DB 마이그레이션 적용 여부 확인 ──────────────────────
      # 배포는 DB 구조를 바꾸지 않는다. 새 마이그레이션이 운영 DB 에 아직 없으면
      # 새 코드가 없는 테이블·칼럼을 찾아 실패하므로(P2021/P2022), 서버를 멈추기 전에 배포를 중단한다.
      # migrate status 는 미적용·불일치가 있으면 종료 코드 1 을 낸다. 해결: 운영 DB 에 SQL 적용 후
      # `npx prisma migrate resolve --applied <이름>` 으로 기록하고 다시 실행한다.
      - name: Check production DB migrations
        run: npx prisma migrate status

      # ── 2단계: 서버 중단 (next-swc .node 파일 잠금 해제) ─────────────────
      - name: Stop WBSMaster process
        run: |
          set PM2_HOME=C:\Users\Administrator\.pm2
          pm2 stop wbs-master 2>nul || echo "wbs-master not running"
          pm2 delete wbs-master 2>nul || echo "wbs-master not registered"
        shell: cmd
        continue-on-error: true

      # ── 3단계: 의존성/빌드 ────────────────────────────────────────────────
      - name: Validate lock file sync
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # .next/dev/types는 next dev 산출물인데 tsconfig include에 포함되어,
      # 삭제된 라우트를 참조하는 오래된 파일이 남아 있으면 빌드 타입 검사가 실패함
      - name: Remove stale next dev artifacts
        run: if (Test-Path .next\dev) { Remove-Item .next\dev -Recurse -Force }

      - name: Build
        run: npm run build

      # ── 4단계: 빌드 성공 후 서버 재시작 ──────────────────────────────────
      - name: Start WBSMaster PM2 process
        run: |
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          $ErrorActionPreference = 'SilentlyContinue'
          pm2 delete wbs-master 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          Set-Location D:\Project\WBSMaster
          pm2 start ecosystem.config.js --update-env
          pm2 save
          Start-Sleep 5
          pm2 list
        shell: powershell
