name: Deploy to Windows Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: C:\Project\WBSMaster

    steps:
      - name: Check current user
        run: |
          echo "=== Current User ==="
          whoami
          echo "=== PM2 Home ==="
          echo %PM2_HOME%
          echo %USERPROFILE%
        shell: cmd

      - name: Configure Git safe directory
        run: git config --global --add safe.directory C:/Project/WBSMaster

      - name: Stop WBSMaster process only
        run: |
          set PM2_HOME=C:\Users\Administrator\.pm2
          echo "=== Stopping wbs-master only (not killing PM2) ==="
          pm2 stop wbs-master 2>nul || echo "wbs-master not running"
          pm2 delete wbs-master 2>nul || echo "wbs-master not registered"
        shell: cmd
        continue-on-error: true

      - name: Pull latest code
        run: |
          git fetch origin master
          git reset --hard origin/master

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Start WBSMaster PM2 process
        run: |
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          $ErrorActionPreference = 'SilentlyContinue'
          pm2 delete wbs-master 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          Set-Location C:\Project\WBSMaster
          pm2 start ecosystem.config.js --update-env
          pm2 save
          Start-Sleep 5
          pm2 list
        shell: powershell
