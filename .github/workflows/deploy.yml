name: Deploy to Windows Server

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: C:\Project\WBSMaster

    steps:
      - name: Check current user
        run: |
          echo "=== Current User ==="
          whoami
          echo "=== PM2 Home ==="
          echo %PM2_HOME%
          echo %USERPROFILE%
        shell: cmd

      - name: Configure Git safe directory
        run: git config --global --add safe.directory C:/Project/WBSMaster

      # ── 1단계: 코드 pull ──────────────────────────────────────────────────
      - name: Pull latest code
        run: |
          git fetch origin master
          git reset --hard origin/master

      # ── 2단계: 서버 중단 (next-swc .node 파일 잠금 해제) ─────────────────
      - name: Stop WBSMaster process
        run: |
          set PM2_HOME=C:\Users\Administrator\.pm2
          pm2 stop wbs-master 2>nul || echo "wbs-master not running"
          pm2 delete wbs-master 2>nul || echo "wbs-master not registered"
        shell: cmd
        continue-on-error: true

      # ── 3단계: 의존성/빌드 ────────────────────────────────────────────────
      - name: Validate lock file sync
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # .next/dev/types는 next dev 산출물인데 tsconfig include에 포함되어,
      # 삭제된 라우트를 참조하는 오래된 파일이 남아 있으면 빌드 타입 검사가 실패함
      - name: Remove stale next dev artifacts
        run: if (Test-Path .next\dev) { Remove-Item .next\dev -Recurse -Force }

      - name: Build
        run: npm run build

      # ── 4단계: 빌드 성공 후 서버 재시작 ──────────────────────────────────
      - name: Start WBSMaster PM2 process
        run: |
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"
          $ErrorActionPreference = 'SilentlyContinue'
          pm2 delete wbs-master 2>&1 | Out-Null
          $ErrorActionPreference = 'Stop'
          Set-Location C:\Project\WBSMaster
          pm2 start ecosystem.config.js --update-env
          pm2 save
          Start-Sleep 5
          pm2 list
        shell: powershell
